# Publishes the current fork's viewer directory to this fork's GitHub Pages site.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "viewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: viewer

      - name: Deploy to GitHub Pages
        id: deployment
        # Use the REST-based official release: current v4's Twirp listing can
        # miss artifacts that the upload step and public REST API both confirm.
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
