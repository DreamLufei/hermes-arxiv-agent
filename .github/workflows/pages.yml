# Publishes the current fork's viewer directory to this fork's GitHub Pages site.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "viewer/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/deploy_pages.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: viewer

      - name: Deploy to GitHub Pages
        id: deployment
        # Deploy the verified immutable ID returned by upload, not a flaky list.
        run: python3 .github/scripts/deploy_pages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
